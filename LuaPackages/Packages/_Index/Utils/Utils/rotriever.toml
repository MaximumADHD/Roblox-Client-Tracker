[package]
name = "Utils"
version = "0.3.2"
readme = "README.md"
content_root = "src"
files = [
    "*",
    "!**/tests/**",
]
publish = true
license = "MIT"
[dependencies.GraphQL]
target = "https://github.com/roblox/graphql-lua"
version = "^15.6.0"

[dependencies.LuauPolyfill]
target = "https://github.com/roblox/luau-polyfill"
version = "^1.2"

[dependencies.LuauRegExp]
target = "https://github.com/roblox/luau-regexp"
package = "RegExp"
version = "^0.2.0"

[dependencies.Promise]
target = "https://github.com/roblox/roblox-lua-promise"
version = "^3.3.0"
[dev_dependencies.JestGlobals]
target = "https://github.com/roblox/jest-roblox"
version = "^3"

[dev_dependencies.Schema]
package = "Schema"
version = "^0.3.2"

[dev_dependencies.Testing]
package = "Testing"
version = "^0.3.2"
