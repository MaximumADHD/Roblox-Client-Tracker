[package]
name = "CommonMark"
version = "0.1.1"
readme = "README.md"
content_root = "src"
files = [
    "*",
    "!**/*.test.lua",
    "!**/__fixtures__/**",
    "!**/test/**",
    "!**/testutil/**",
    "!**/.luaurc",
]
publish = true
authors = ["Elvis Wei <ewei@roblox.com>"]
description = "CommonMark parser and HTML renderer, ported from commonmark-java"
keywords = [
    "markdown",
    "commonmark",
    "parser",
]
[dev_dependencies.Jest]
version = "= 3.13.3"

[dev_dependencies.JestGlobals]
version = "= 3.13.3"
