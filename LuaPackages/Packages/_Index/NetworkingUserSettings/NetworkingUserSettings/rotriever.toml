[package]
name = "NetworkingUserSettings"
version = "1.17.5"
readme = "README.md"
content_root = "src"
files = [
    "!*.storybook.lua",
    "!*.story.lua",
    "!*.spec.lua",
]
publish = true
authors = ["Roblox"]
[dependencies.Util]
package = "Util"
version = "^1.17.5"
[dev_dependencies.HttpRequest]
target = "https://github.com/roblox/http-request"
version = "^1.1.1"

[dev_dependencies.JestGlobals]
target = "https://github.com/roblox/jest-roblox"
version = "^2.3.1"

[dev_dependencies.Mock]
target = "https://github.com/roblox/mock"
package = "mock"
version = "^0.1.0"

[dev_dependencies.Rodux]
target = "https://github.com/roblox/rodux"
version = "^3.3.0"

[dev_dependencies.RoduxNetworking]
target = "https://github.com/roblox/rodux-networking"
version = "^3.0.1"

[dev_dependencies.tutils]
target = "https://github.com/roblox/tutils"
version = "^0.1.2"
