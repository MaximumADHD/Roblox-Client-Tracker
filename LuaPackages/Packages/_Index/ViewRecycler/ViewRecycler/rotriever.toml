[package]
name = "ViewRecycler"
version = "0.8.1"
readme = "README.md"
content_root = "src"
files = [
    "*",
    "!**/*.test.lua",
    "!**/*.test.luau",
    "!**/*.spec.lua",
    "!**/*.spec.luau",
    "!**/*.story.lua",
    "!**/*.story.luau",
    "!**/*.storybook.lua",
    "!**/*.storybook.luau",
    "!**/__tests__/**",
    "!**/__benchmarks__/**",
    "!**/TestDependencies.luau",
]
publish = true
authors = ["App Foundation <app-foundation@roblox.com>"]
description = "Framework-neutral view recycling and virtualization for Luau"
repository = "https://github.com/Roblox/view-recycler"
homepage = "https://roblox.github.io/view-recycler/"
documentation = "https://roblox.github.io/view-recycler/"
[dev_dependencies.Jest]
version = "^3.13.0"

[dev_dependencies.JestGlobals]
version = "^3.13.0"
