[package]
name = "MomentScenes"
version = "0.1.3"
readme = "README.md"
content_root = "src"
files = [
    "*",
    "!**/*.test.lua",
    "!Testing/**",
    "!**/AGENTS.md",
    "!Builders/_Utils/backgroundCatalog.lua",
    "!Builders/AvatarMoment/mockOutfits.lua",
]
publish = true
authors = [
    "Roblox Economy",
    "lua-apps-sharing",
]
description = "Shared scene-building package for Live 3D Moments"
repository = "https://github.com/Roblox/MomentScenes"
keywords = [
    "moments",
    "avatar",
    "3d",
    "scenes",
]
homepage = ""
documentation = ""
[dependencies.SafeFlags]
version = "^0.1.0"
[dev_dependencies.Foundation]
version = "^1.94.0"

[dev_dependencies.Jest]
version = "^3.13.0"

[dev_dependencies.JestGlobals]
version = "^3.13.0"

[dev_dependencies.React]
version = "^17.3.8"

[dev_dependencies.ReactRoblox]
version = "^17.3.8"
